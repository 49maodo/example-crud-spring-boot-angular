<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" routerLink="/">Gestion de T-Shirts</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" routerLink="/products" routerLinkActive="active">Produits</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/cart" routerLinkActive="active"
                        *ngIf="authService.isAuthenticated() && !authService.isAdmin()">
                        <i class="bi bi-cart"></i> Panier
                        <span class="badge border border-light rounded-circle bg-danger"
                            *ngIf="(cartCount$ | async) as count">{{ count }}</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/my-orders" routerLinkActive="active"
                        *ngIf="authService.isAuthenticated()">Mes Commandes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/all-orders" routerLinkActive="active"
                        *ngIf="authService.isAdmin()">Toutes les Commandes</a>
                </li>
            </ul>
            <ul class="navbar-nav" *ngIf="authService.currentUser$ | async as user; else loggedOut">
                <li class="nav-item d-flex align-items-center me-3">
                    <span class="badge bg-secondary">{{ user.role === 'ROLE_ADMIN' ? 'Administrateur' : 'Client'
                        }}</span>
                    <span class="text-light ms-2">{{ user.username }}</span>
                </li>

                    <a class="nav-link" style="cursor: pointer;" (click)="logout()">Déconnexion</a>

    <app-notification></app-notification>
