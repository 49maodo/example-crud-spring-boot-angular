<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-4">Connexion</h2>
                <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" name="username"
                            [(ngModel)]="credentials.username" required #username="ngModel">
                        <div *ngIf="username.invalid && (username.dirty || username.touched)"
                            class="text-danger small mt-1">
                            Le nom d'utilisateur est requis.
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" name="password"
                            [(ngModel)]="credentials.password" required #password="ngModel">
                        <div *ngIf="password.invalid && (password.dirty || password.touched)"
                            class="text-danger small mt-1">
                            Le mot de passe est requis.
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">Se
                            connecter</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted">Vous n'avez pas de compte ?</span>
                    <a routerLink="/register" class="ms-1 text-decoration-none">S'inscrire</a>
                </div>
            </div>
        </div>
    </div>
</div>
